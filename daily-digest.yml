name: Daily AI Research Digest

on:
  schedule:
    # - cron: "0 12 * * *"   # 12:00 UTC = 7am/8am ET depending on DST — adjust as needed
    - cron: "35 19 * * *"
      timezone: "America/New_York"
  workflow_dispatch: {}      # allows manual trigger from GitHub UI

jobs:
  run-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests feedparser

      - name: Run digest script
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python daily_digest.py

      - name: Commit digest to repo
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add digest_latest.md
          git commit -m "Daily digest $(date +%Y-%m-%d)" || echo "No changes"
          git push
